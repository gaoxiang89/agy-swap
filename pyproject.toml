[project]
name = "agy-swap"
version = "0.2.0"
description = "Multi-account switcher for Antigravity CLI (agy), on macOS, Linux and Windows"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "pr656d" }]
keywords = ["antigravity", "agy", "gemini", "cli", "accounts", "quota"]
dependencies = [
    "rich>=13.0",
    "textual>=1.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]

[project.scripts]
agyswap = "agyswap.cli:main"
agyswap-statusline = "agyswap.statusline:main"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agyswap*"]

[tool.setuptools.package-data]
agyswap = ["tui/*.tcss"]

[project.urls]
Homepage = "https://github.com/pr656d/agy-swap"
Repository = "https://github.com/pr656d/agy-swap"
